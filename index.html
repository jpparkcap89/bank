<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내게 필요한 앱, 내가 만들어 쓰기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ───────── cap89 style tokens ───────── */
:root{
  --ink:#24324a; --muted:#667085; --primary:#3b63f6; --primary-hover:#254ed8;
  --sky:#38bdf8; --accent:#ffcf70; --secondary:#7fd8c9; --pink:#ff9fb5; --white:#fff;
  --fe:#3b63f6; --be:#ea7a1f; --db:#2b9a5c;
  --panel:rgba(255,255,255,.72); --panel-line:rgba(255,255,255,.95); --hairline:rgba(36,50,74,.07);
  --shadow:0 20px 60px rgba(67,89,146,.16); --shadow-sm:0 8px 24px rgba(50,68,110,.08);
  --r-xl:34px; --r-lg:26px; --r-md:16px; --r-sm:14px; --r-pill:999px;
  --font:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --grad:linear-gradient(100deg,#3b63f6 0%,#38bdf8 52%,#f59e0b 100%);
  /* Lucian UX/UI 토큰 → cap89 팔레트 */
  --ux-page:#f8fbff; --ux-surface:#ffffff; --ux-surface-2:#f4f7ff; --ux-surface-3:#e8eefc;
  --ux-ink:#24324a; --ux-ink-2:#667085; --ux-ink-3:#98a2b3;
  --ux-line:rgba(36,50,74,.07); --ux-line-2:rgba(36,50,74,.15);
  --ux-accent:#3b63f6; --ux-accent-2:#38bdf8; --ux-accent-soft:rgba(59,99,246,.12); --ux-accent-ink:#ffffff;
  --ux-mint:#2bb39a; --ux-warn:#f59e0b; --ux-danger:#e5486b;
  --ux-glass:rgba(255,255,255,.72); --ux-glass-line:rgba(255,255,255,.95);
  --ux-shadow:rgba(67,89,146,.16); --ux-shadow-strong:rgba(67,89,146,.32);
  --ux-grad:linear-gradient(100deg,#3b63f6 0%,#38bdf8 52%,#f59e0b 100%);
  --ux-ease:cubic-bezier(.2,.8,.2,1); --ux-spring:cubic-bezier(.34,1.45,.64,1);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:var(--font); color:var(--ink); font-size:16px; line-height:1.7; word-break:keep-all; overflow-wrap:break-word;
  min-height:100vh; -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(circle at 12% 18%, rgba(255,207,112,.45), transparent 28%),
    radial-gradient(circle at 88% 14%, rgba(127,216,201,.45), transparent 30%),
    radial-gradient(circle at 75% 82%, rgba(255,159,181,.28), transparent 28%),
    linear-gradient(135deg,#f8fbff 0%,#fffdf7 45%,#f8fffc 100%);
  background-attachment:fixed;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--primary)}
.blob{position:fixed;z-index:0;border-radius:50%;filter:blur(60px);opacity:.5;pointer-events:none;animation:float 8s ease-in-out infinite}
.blob.b1{width:260px;height:260px;left:-80px;top:30%;background:#ffcf70}
.blob.b2{width:300px;height:300px;right:-100px;top:8%;background:#7fd8c9;animation-duration:9s}
.blob.b3{width:240px;height:240px;right:20%;bottom:-90px;background:#ff9fb5;animation-duration:7s}
@keyframes float{50%{transform:translate(10px,-18px)}}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ───────── header ───────── */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:12px 24px;background:rgba(248,251,255,.7);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--hairline)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:none;max-width:38%;background:none;border:0;padding:0;text-align:left}
.mark{flex:none;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#3b63f6,#8e9cff);color:#fff;font-weight:800;font-size:17px;box-shadow:0 10px 25px rgba(59,99,246,.28)}
.brand b{display:block;font-size:16px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.brand span{min-width:0}
.nav{flex:1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.nav>:first-child{margin-left:auto}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:none;height:36px;padding:0 14px;border-radius:var(--r-pill);border:1px solid var(--hairline);background:rgba(255,255,255,.78);font-size:14px;font-weight:650;color:var(--ink);transition:.2s}
.nav button:hover{border-color:rgba(59,99,246,.3);color:var(--primary)}
.nav button.on{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 8px 18px -8px rgba(59,99,246,.6)}
.admin-btn{flex:none;height:36px;padding:0 14px;border-radius:var(--r-pill);border:1px solid rgba(59,99,246,.25);background:#fff;color:var(--primary);font-size:14px;font-weight:700}
.admin-btn.on{background:#24324a;color:#fff;border-color:#24324a}
.fs-btn{border-color:var(--hairline);color:var(--ink)}
/* 전체 화면(발표) 모드: 차례를 숨기고 글자를 키웁니다 */
body.present .toc,body.present .toc-fab,body.present .hint,body.present .blob,body.present .edit-slide{display:none!important}
body.present .layout{grid-template-columns:1fr;max-width:1500px;padding-top:16px}
body.present .slide{min-height:calc(100vh - 170px);padding:52px 64px}
body.present .md{font-size:22px;max-width:1100px}
body.present .slide-h{font-size:clamp(32px,3.8vw,50px)}
body.present .u008-code{font-size:18px}
body.present .fs-btn{background:#24324a;color:#fff;border-color:#24324a}
.progress{position:sticky;top:64px;z-index:29;height:4px;background:rgba(59,99,246,.08)}
.progress i{display:block;height:100%;width:0;background:var(--grad);border-radius:0 4px 4px 0;transition:width .5s var(--ux-ease)}

/* ───────── layout ───────── */
.layout{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;max-width:1260px;margin:0 auto;padding:22px 24px 40px}
.glass{background:var(--panel);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--panel-line);border-radius:var(--r-xl);box-shadow:var(--shadow)}
.stage{min-width:0;display:flex;flex-direction:column;gap:14px}
.slide{position:relative;min-height:calc(100vh - 230px);padding:44px 48px;animation:pageIn .5s var(--ux-ease)}
.pager{display:grid;grid-template-columns:1fr 2fr;gap:12px}
.pager button{height:60px;border-radius:20px;font-size:16px;font-weight:750;border:1px solid var(--hairline);transition:.2s}
.pager .prev{background:rgba(255,255,255,.78);color:var(--ink)}
.pager .next{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 14px 28px -14px rgba(59,99,246,.7)}
.pager .next:hover{background:var(--primary-hover)}
.pager button:disabled{opacity:.4;cursor:default;box-shadow:none}
.hint{margin:0;text-align:center;font-size:13px;color:var(--muted)}

/* table of contents */
.toc{position:sticky;top:90px;align-self:start;max-height:calc(100vh - 110px);display:flex;flex-direction:column;padding:20px 12px 12px;border-radius:var(--r-lg)}
.toc h2{margin:0 10px;font-size:17px;font-weight:800}
.toc .seen{margin:2px 10px 10px;font-size:12.5px;color:var(--muted)}
.toc .seen-bar{height:5px;margin:0 10px 12px;border-radius:5px;background:var(--ux-surface-3);overflow:hidden}
.toc .seen-bar i{display:block;height:100%;background:var(--grad);transition:width .4s}
.toc ol{list-style:none;margin:0;padding:0 2px;overflow-y:auto;flex:1}
.toc .grp{margin:14px 10px 4px;font-size:12px;font-weight:750;color:var(--primary);letter-spacing:.02em}
.toc .grp:first-child{margin-top:0}
.toc li button{display:flex;align-items:flex-start;gap:10px;width:100%;padding:8px 10px;border:0;border-radius:12px;background:none;text-align:left;font-size:14px;line-height:1.45;color:var(--ink);transition:background .2s}
.toc li button:hover{background:rgba(59,99,246,.07)}
.toc li button em{flex:none;width:22px;font-style:normal;font-size:12px;font-weight:700;color:var(--ux-ink-3);padding-top:1px;font-variant-numeric:tabular-nums}
.toc li button span{flex:1}
.toc li button.is-seen em{color:var(--ux-mint)}
.toc li button.on{background:var(--ink);color:#fff}
.toc li button.on em{color:rgba(255,255,255,.6)}
.toc .tag{flex:none;font-size:11px;font-weight:750;padding:1px 7px;border-radius:999px;background:var(--ux-accent-soft);color:var(--primary)}
.toc li button.on .tag{background:rgba(255,255,255,.18);color:#fff}
.toc-fab{display:none}
.scrim{position:fixed;inset:0;z-index:40;background:rgba(36,50,74,.28);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}

/* ───────── slide content ───────── */
.eyebrow{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.78);border:1px solid rgba(59,99,246,.14);box-shadow:var(--shadow-sm);color:var(--primary);font-size:13.5px;font-weight:750}
.slide-h{margin:16px 0 10px;font-size:clamp(26px,3.4vw,40px);font-weight:850;letter-spacing:-.028em;line-height:1.25}
.edit-slide{position:absolute;right:18px;top:18px;height:34px;padding:0 12px;border-radius:999px;border:1px solid rgba(59,99,246,.25);background:#fff;color:var(--primary);font-size:13px;font-weight:700}
.md{font-size:18px;line-height:1.8;max-width:880px}
.md p{margin:.4em 0 .8em}
.md ul,.md ol{margin:.4em 0 1em;padding-left:1.3em}
.md li{margin:.35em 0}
.md li::marker{color:var(--primary);font-weight:800}
.md strong{color:#1c2a44;background:linear-gradient(transparent 62%,rgba(255,207,112,.55) 62%)}
.md code{padding:2px 7px;border-radius:7px;background:rgba(59,99,246,.09);color:var(--primary);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.86em}
.md h3{margin:.3em 0 .5em;font-size:26px;font-weight:850;letter-spacing:-.025em}
.md h3 strong{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.md blockquote{margin:1.1em 0 .4em;padding:14px 18px;border-radius:var(--r-md);background:rgba(255,255,255,.78);border:1px solid var(--hairline);border-left:4px solid var(--accent);font-size:17px}
.md img{max-width:100%;border-radius:var(--r-md)}
.md .tbl{overflow-x:auto;margin:.6em 0 1em}
.md table{border-collapse:separate;border-spacing:0;width:100%;min-width:480px;background:rgba(255,255,255,.78);border:1px solid var(--hairline);border-radius:var(--r-md);overflow:hidden;font-size:16px}
.md th,.md td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--hairline)}
.md th{background:rgba(59,99,246,.07);font-size:14px;font-weight:750;color:var(--primary)}
.md tr:last-child td{border-bottom:0}
.md ol.steps{list-style:none;padding:0;counter-reset:s}
.md ol.steps>li{counter-increment:s;position:relative;padding:12px 16px 12px 58px;margin:8px 0;border-radius:var(--r-md);background:rgba(255,255,255,.78);border:1px solid var(--hairline)}
.md ol.steps>li::before{content:counter(s);position:absolute;left:14px;top:12px;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--primary);color:#fff;font-weight:800;font-size:15px}
.prompt-h{margin:26px 0 4px;font-size:18px;font-weight:800}
.prompt-h small{display:block;margin-top:2px;font-size:13.5px;font-weight:600;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:start}
.card{background:rgba(255,255,255,.78);border:1px solid var(--hairline);border-radius:var(--r-md);padding:18px;transition:.2s}
.btn{height:48px;padding:0 20px;border-radius:16px;border:0;background:var(--primary);color:#fff;font-weight:750;font-size:15px;transition:.2s}
.btn:hover{background:var(--primary-hover)}
.btn.ghost{background:rgba(255,255,255,.85);color:var(--primary);border:1px solid rgba(59,99,246,.2)}
.btn.sm{height:38px;padding:0 14px;border-radius:12px;font-size:14px}
.btn.danger{background:#fff;color:var(--ux-danger);border:1px solid rgba(229,72,107,.3)}
.btn:disabled{opacity:.5;cursor:default}
.field{display:block;margin-bottom:12px}
.field>span{display:block;margin-bottom:6px;font-size:14px;font-weight:700;color:#3a4863}
.inp{width:100%;min-height:50px;padding:12px 15px;border-radius:15px;border:1.5px solid transparent;background:var(--ux-surface-2);font-size:16px;transition:.2s;outline:none}
.inp:focus{background:#fff;border-color:var(--primary);box-shadow:0 0 0 4px var(--ux-accent-soft)}
textarea.inp{min-height:110px;resize:vertical;line-height:1.6}

/* cover */
.cover h1{margin:18px 0 12px;font-size:clamp(32px,4.6vw,52px);font-weight:850;letter-spacing:-.03em;line-height:1.2}
.cover h1 .g{display:table;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.cover .sub{margin:0 0 26px;font-size:20px;color:var(--muted)}
.namecard{max-width:560px;padding:20px 22px;border-radius:var(--r-lg);background:rgba(59,99,246,.07);border:1px solid rgba(59,99,246,.12)}
.namecard b{display:block;margin-bottom:10px;font-size:16px}
.namecard .row{display:flex;gap:8px}
.namecard small{display:block;margin-top:8px;font-size:13px;color:var(--muted)}
.meta{margin-top:28px;display:flex;flex-wrap:wrap;gap:8px}
.meta span{padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.8);border:1px solid var(--hairline);font-size:14px;font-weight:650}

/* concept */
.concept-img{display:block;width:100%;max-width:820px;margin:6px 0 18px;border-radius:var(--r-lg);box-shadow:var(--shadow-sm);background:#fbf6ee}
.concept-crop{max-width:820px;margin:6px 0 18px;aspect-ratio:1316/740;overflow:hidden;border-radius:var(--r-lg);box-shadow:var(--shadow-sm);background:#fbf6ee}
.concept-crop img{display:block;width:110.2%;max-width:none;margin:-11.6% 0 0 -6.4%}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.trio .card{cursor:pointer;text-align:left;font:inherit;padding:20px;border-top:4px solid var(--c)}
.trio .card:hover{transform:translateY(-3px);box-shadow:var(--shadow-sm)}
.trio .card.on{background:#fff;box-shadow:0 0 0 2px var(--c),var(--shadow-sm)}
.trio .ic{font-size:34px;line-height:1}
.trio .nm{display:block;margin-top:10px;font-size:20px;font-weight:850;color:var(--c)}
.trio .an{display:block;font-size:17px;font-weight:750;margin-top:2px}
.trio p{margin:8px 0 10px;font-size:15px;color:var(--muted);line-height:1.65}
.trio .chip{display:inline-block;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c);font-size:13px;font-weight:800}
.trio.big .card{text-align:center;padding:28px 18px}
.trio.big .nm{font-size:38px;margin-top:8px;letter-spacing:-.03em}
.trio.big .an{font-size:16px;color:var(--muted);font-weight:650}
.trio.big p{margin-top:12px;font-size:14.5px}

/* flow */
.flow-track{position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:12px;margin:10px 0 18px}
.flow-node{position:relative;padding:16px 12px;border-radius:var(--r-md);background:rgba(255,255,255,.78);border:1px solid var(--hairline);text-align:center;opacity:.55;transition:.35s var(--ux-ease)}
.flow-node .e{font-size:34px;line-height:1.1}
.flow-node b{display:block;margin-top:6px;font-size:14.5px;line-height:1.4}
.flow-node .r{display:inline-block;margin-top:8px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:800;background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c)}
.flow-node.done{opacity:.85}
.flow-node.on{opacity:1;background:#fff;transform:translateY(-4px);box-shadow:0 0 0 2px var(--c),var(--shadow-sm)}
.flow-node:not(:last-child)::after{content:"→";position:absolute;right:-12px;top:50%;transform:translate(50%,-50%);color:var(--ux-ink-3);font-weight:800;z-index:1}
.flow-detail{display:flex;gap:18px;align-items:center;padding:20px 22px;border-radius:var(--r-lg);background:#fff;border:1px solid var(--hairline);box-shadow:var(--shadow-sm);min-height:120px;animation:pageIn .4s var(--ux-ease)}
.flow-detail .e{font-size:54px;line-height:1}
.flow-detail h3{margin:0;font-size:21px;font-weight:800}
.flow-detail p{margin:4px 0 8px;color:var(--muted)}
.flow-ctl{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:18px;font-weight:750}
.chain span{padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.8);border:1px solid var(--hairline);transition:.3s}
.chain span.on{background:var(--c);color:#fff;border-color:transparent}
.chain i{font-style:normal;color:var(--ux-ink-3)}

/* quiz */
.quiz{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.qz{padding:16px 18px}
.qz b{display:block;font-size:16.5px;margin-bottom:10px}
.qz .opts{display:flex;flex-wrap:wrap;gap:6px}
.qz .opts button{height:36px;padding:0 12px;border-radius:999px;border:1.5px solid var(--hairline);background:#fff;font-size:13.5px;font-weight:700;transition:.2s}
.qz .opts button:hover{border-color:var(--c);color:var(--c)}
.qz.ok{border-color:var(--ux-mint);background:color-mix(in srgb,var(--ux-mint) 8%,#fff)}
.qz.ok .opts button.pick{background:var(--ux-mint);border-color:var(--ux-mint);color:#fff}
.qz.no{animation:shake .45s}
.qz .why{font-size:14px;font-weight:700;color:var(--ux-mint);margin-top:8px}
@keyframes shake{20%{transform:translateX(-7px)}45%{transform:translateX(6px)}70%{transform:translateX(-3px)}}
.score{display:inline-flex;align-items:center;gap:8px;margin:0 0 14px;padding:8px 14px;border-radius:999px;background:#fff;border:1px solid var(--hairline);font-weight:750}

/* forms & walls */
.form-card{max-width:760px;padding:22px;border-radius:var(--r-lg);background:rgba(255,255,255,.8);border:1px solid var(--hairline);box-shadow:var(--shadow-sm)}
.form-row{display:grid;grid-template-columns:200px 1fr;gap:12px}
.form-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.wall-h{display:flex;align-items:center;gap:10px;margin:26px 0 10px}
.wall-h h3{margin:0;font-size:18px;font-weight:800}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.wall .card{padding:14px 16px;font-size:15px;line-height:1.6;animation:pageIn .4s var(--ux-ease) both}
.wall .card small{display:block;margin-top:6px;font-size:12.5px;color:var(--muted)}
.notice{padding:16px 18px;border-radius:var(--r-md);background:rgba(255,207,112,.25);border:1px solid rgba(245,158,11,.25);font-weight:650}
.thanks{text-align:center;padding:30px 10px}
.thanks .e{font-size:56px}

/* ───────── admin ───────── */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(36,50,74,.35);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .3s}
.modal.on{opacity:1;pointer-events:auto}
.modal .x{position:absolute;top:14px;right:14px;z-index:5;width:36px;height:36px;border-radius:50%;border:0;background:var(--ux-surface-2);font-size:18px}
.login-wrap{position:relative}
.admin{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:rgba(248,251,255,.94);backdrop-filter:blur(18px);transform:translateY(16px);opacity:0;pointer-events:none;transition:.35s var(--ux-ease)}
.admin.on{transform:none;opacity:1;pointer-events:auto}
.admin-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 24px;border-bottom:1px solid var(--hairline);background:rgba(255,255,255,.7)}
.admin-top h2{margin:0;font-size:19px;font-weight:850}
.admin-top .sp{flex:1}
.admin-body{flex:1;overflow:auto;padding:22px 24px 60px}
.admin-inner{max-width:1180px;margin:0 auto}
.warnbar{margin-bottom:14px;padding:12px 16px;border-radius:14px;background:rgba(229,72,107,.08);border:1px solid rgba(229,72,107,.2);color:#b4234a;font-weight:650;font-size:14.5px}
.set-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px}
.set-grid .full{grid-column:1/-1}

#print{display:none}
@media print{

  .brand{max-width:calc(100% - 210px)}
  .fs-btn{padding:0 10px}
  .nav{order:3;flex-basis:100%;justify-content:flex-start}
  .progress{top:0}
  .layout{padding:14px 16px 30px}
  .slide{padding:26px 20px;min-height:auto;border-radius:var(--r-lg)}
  .md{font-size:16.5px}
  .trio,.quiz,.set-grid,.form-row,.pe-form .grid3{grid-template-columns:1fr}
  .flow-track{grid-template-columns:1fr 1fr}
  .flow-node:not(:last-child)::after{display:none}
  .pager button{height:52px}
  .admin-top,.admin-body{padding-left:16px;padding-right:16px}
}
@media (prefers-reduced-motion:reduce){
  .blob{animation:none}

  *{transition-duration:.001ms!important}
}

/* 전체 화면으로 보기: 브라우저 전체 화면 + 발표 모드. 전체 화면이 막힌 곳(앱 안 iframe 등)에서는 발표 모드만 켭니다. */
function setPresent(on) {
  document.body.classList.toggle('present', on);
  $('#fsBtn').textContent = on ? '⤫ 전체 화면 끝내기' : '⛶ 전체 화면';
}
function togglePresent() {
  var on = !document.body.classList.contains('present');
  var el = document.documentElement;
  if (on) {
    setPresent(true);
    try { var p = (el.requestFullscreen || el.webkitRequestFullscreen).call(el); if (p && p.catch) p.catch(function () {}); } catch (e) { /* 발표 모드만 */ }
  } else {
    setPresent(false);
    try { if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) { /* 무시 */ }
  }
}
$('#fsBtn').addEventListener('click', togglePresent);
document.addEventListener('fullscreenchange', function () { if (!document.fullscreenElement) setPresent(false); });
document.addEventListener('keydown', function (e) {
  if (e.target.closest('input,textarea,select,[contenteditable],[role=slider]')) return;
  if ($('#admin').classList.contains('on') || $('#loginModal').classList.contains('on')) { if (e.key === 'Escape') { closeLogin(); } return; }
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); go(S.idx + 1); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(S.idx - 1); }
  if ((e.key === 'f' || e.key === 'F') && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); togglePresent(); }
});

    var bin = atob(r.base64), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
    var a = document.createElement('a'); a.href = url; a.download = r.fileName; document.body.appendChild(a); a.click(); a.remove();
    var slot = $('.pdf-slot');
    if (slot) slot.innerHTML = '<p class="card" style="margin:0 0 12px">✅ <b>' + esc(r.fileName) + '</b> — 내려받기가 시작되지 않으면 <a href="' + url + '" download="' + esc(r.fileName) + '">여기를 눌러 내려받기</a>' + (r.driveUrl ? ' · <a href="' + esc(r.driveUrl) + '" target="_blank" rel="noopener">드라이브에서 열기</a>' : '') + '</p>';
    w.done('ok', 'PDF를 만들었어요', r.fileName);
  }).catch(function (x) {
    var m = errMsg(x);
    if (/로그인이 필요/.test(m)) { w.close(); return authFail(x); }
    w.done('err', 'PDF를 바로 만들지 못했어요', '인쇄 창에서 ‘PDF로 저장’을 골라 주세요');
    printResp(kind);
  });
}
function printResp(kind) {
  var s = S.settings, d = S.admin, out = '<h1>' + esc(s.siteTitle) + '</h1><div class="m">' + esc([s.dateText, s.place, s.instructor].filter(Boolean).join(' · ')) + '</div>';
  if (kind !== 'reflections') {
    out += '<h2>연수 전 질문 (' + d.questions.length + '개)</h2><table><tr><th>#</th><th>이름</th><th>질문</th><th>제출 시각</th></tr>' +
      d.questions.map(function (q, i) { return '<tr><td>' + (i + 1) + '</td><td>' + esc(q['이름']) + '</td><td>' + esc(q['질문']) + '</td><td>' + esc(q['제출시각']) + '</td></tr>'; }).join('') + '</table>';
  }
  if (kind !== 'questions') {
    var avg = avgRating(d.reflections);
    out += '<h2>연수 성찰 (' + d.reflections.length + '명)</h2>' + (avg ? '<p><b>평균 만족도 ' + avg + ' / 5</b></p>' : '') +
      d.reflections.map(function (r, i) { var n = Number(r['만족도']) || 0; return '<div class="r"><b>' + (i + 1) + '. ' + esc(r['이름']) + '</b> ' + (n ? '★'.repeat(n) + '☆'.repeat(5 - n) : '') + ' · ' + esc(r['제출시각']) + [['오늘 배운 점', r['오늘 배운 점']], ['만들고 싶은 앱', r['만들고 싶은 앱']], ['하고 싶은 말', r['하고 싶은 말']]].filter(function (x) { return x[1]; }).map(function (x) { return '<div><b>' + x[0] + ':</b> ' + esc(x[1]) + '</div>'; }).join('') + '</div>'; }).join('');
  }
  $('#print').innerHTML = out;
  setTimeout(function () { window.print(); }, 100);
}

/* ════════════════ 시작 ════════════════ */
function start() {
  var fill = lxFill('연수 자료 불러오는 중');
  api('getBootstrap').then(function (d) {
    fill.done();
    S.settings = d.settings; S.pages = d.pages;
    applySettings(); updateAdminBtn();
    var m = (location.hash || '').match(/^#(\d+)$/), n = m ? +m[1] - 1 : 0;
    if (S.token) api('adminGetData', S.token).then(function (a) { S.admin = a; }).catch(function () { S.token = null; try { sessionStorage.removeItem('gt_token'); } catch (e) { /* 무시 */ } updateAdminBtn(); renderSlide(); });
    try {
      google.script.url.getLocation(function (loc) { var hh = parseInt(loc.hash, 10); go(hh > 0 ? hh - 1 : n); });
    } catch (e) { go(n); }
  }).catch(function (e) {
    fill.done();
    $('#slide').innerHTML = '<div class="notice">연수 자료를 불러오지 못했어요: ' + esc(errMsg(e)) + '</div>';
  });
}
window.addEventListener('resize', function () { adminTabs.layout(); });
window.addEventListener('hashchange', function () { var m = (location.hash || '').match(/^#(\d+)$/); if (m && +m[1] - 1 !== S.idx) go(+m[1] - 1); });
if (USE_FETCH) start();
else if (!IN_GAS) {
  var sc = document.createElement('script'); sc.src = 'preview-mock.js'; sc.onload = start;
  sc.onerror = function () { $('#slide').innerHTML = '<div class="notice">Google Apps Script 웹 앱으로 배포해서 열어 주세요.</div>'; };
  document.head.appendChild(sc);
} else start();
</script>
