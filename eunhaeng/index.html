/* ---------- page ---------- */
*{box-sizing:border-box}

  background:linear-gradient(135deg,var(--bg1) 0%,var(--bg2) 45%,var(--bg3) 100%);background-attachment:fixed}

.top-in{max-width:1360px;margin:0 auto;display:flex;align-items:center;gap:16px;padding-block:10px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.brand{min-width:0;display:flex;align-items:center;gap:12px}
.mark{flex:none;width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#3b63f6,#8e9cff);color:#fff;display:grid;place-items:center;font-size:17px;font-weight:800;box-shadow:0 10px 25px rgba(59,99,246,.28)}

.tocbtn{display:none}
.mini-timer{flex:none;display:none;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:var(--r-pill);background:var(--warm-soft);border:1px solid rgba(245,158,11,.3);color:var(--warm);font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;border-width:1px}

.wrap{max-width:1360px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px;padding-block:28px 60px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

.card.section h1.t{font-size:clamp(27px,4.4vw,44px)}

.tag{font-size:11px;font-weight:750;background:var(--ok);color:#fff;border-radius:var(--r-pill);padding:1px 8px}
.toc-foot{border-top:1px solid var(--hairline);padding:10px 20px}

  { section:"실습 2", title:"🗂️ 질문 분류판", p:"탐구할 질문을 고르기 전에, 학생이 닫힌 질문과 열린 질문을 직접 나눠 보는 앱입니다.",
    copy:"초등학교 교실 TV와 태블릿에서 쓸 '질문 분류판' 웹페이지를 HTML 파일 하나로 만들어 줘. 외부 라이브러리 없이 인터넷이 없어도 열리게 해 줘.\n\n- 왼쪽에 질문 카드 모음, 오른쪽에 '닫힌 질문'과 '열린 질문' 두 칸\n- 카드를 손가락이나 마우스로 끌어서 칸에 넣을 수 있게\n- 선생님이 질문을 한 줄에 하나씩 붙여 넣으면 카드가 만들어지게\n- 열린 질문 칸의 카드 중 하나를 누르면 '우리 모둠 탐구 질문'으로 크게 보여 주기" },
  { section:"실습 2", title:"🧪 모둠 탐구 기록장", p:"탐구하는 동안 모둠이 생각을 차례로 남기는 앱입니다.",
    copy:"초등학교 (4)학년 모둠 탐구 활동에 쓸 '탐구 기록장' 웹페이지를 HTML 파일 하나로 만들어 줘. 외부 라이브러리 없이 인터넷이 없어도 열리게 해 줘.\n\n- 모둠 이름(1모둠~6모둠)을 고르는 버튼\n- 네 단계를 차례로 쓰는 칸: 1) 우리의 질문 2) 예상 3) 관찰하고 알아낸 것 4) 새로 생긴 질문\n- 단계를 다 쓰면 다음 단계가 열리고, 위에 진행 표시줄\n- 쓴 내용은 모둠별로 브라우저에 저장하고, 마지막에 한 장으로 모아 보여 주는 '발표 화면' 버튼" },
  { section:"실습 2", title:"우리 반에 맞게 발전시키기", p:"기본이 되면 <strong>한 가지씩</strong> 덧붙여 봅니다.", copy:[
      "질문 옆에 '좋아요' 버튼을 넣어서, 가장 많이 받은 질문이 맨 위로 올라가게 해 줘.",
      "실습 1에서 만든 타이머를 이 앱 오른쪽 위에 작게 넣어 줘. (이전 코드를 함께 붙여 넣기)",
      "전체 내용을 한 번에 지우지 않도록, 지우기 전에 확인 창 대신 화면 안에서 '정말 지울까요?' 버튼을 보여 줘." ],
    tip:"<b>알아 두세요.</b> 오늘 만든 앱은 <strong>한 기기 안에서</strong> 저장됩니다. 학생 각자 태블릿에서 쓴 질문을 한 화면에 모으려면 서버나 공유 저장소가 필요합니다. 이것은 다음 단계에서 다룹니다." },

  /* ---------- 정리 ---------- */
  { section:"정리", kind:"section", num:4, icon:"🌱", title:"정리와", em:"다음 단계", lead:"오늘 만든 앱을 모으고, 학교에서 계속 발전시킬 방법을 살펴봅니다." },
  { section:"정리", title:"완성 파일 받기", p:"오늘 실습한 <strong>앱 예시 파일과 요청문 모음</strong>입니다. 내 앱이 잘 안 열리면 예시 파일과 비교해 보세요.", download:true },
  { section:"정리", title:"앱은 식당처럼 움직입니다", img:"images/restaurant.webp", alt:"식당 그림. 왼쪽 홀에서 학생이 태블릿으로 주문하고(프론트엔드), 가운데 주방에서 요리사가 주문을 받아 요리하고(백엔드), 오른쪽 창고에서 재료를 꺼내 오며(데이터베이스), 완성된 요리가 다시 손님에게 돌아갑니다.",
    lead:"손님이 화면에서 주문하면, 주방이 창고에서 재료를 꺼내 요리하고, 완성된 요리가 다시 손님에게 돌아옵니다." },
  { section:"정리", title:"앱의 세 부분: 프론트엔드, 백엔드, 데이터베이스", p:"실습에서 만든 앱은 <strong>화면만 있는 앱</strong>이라 기기마다 따로 저장됩니다. 여러 사람의 글을 한곳에 모으려면 세 부분이 필요합니다. 식당에 비유해 봅니다.", steps:[
      ["🖥️ 프론트엔드 · 홀","손님이 보고 누르는 화면입니다. 메뉴판과 주문 받는 자리처럼, 사용자가 만나는 모든 것입니다. (HTML, CSS, JavaScript)"],
      ["⚙️ 백엔드 · 주방","화면에서 온 요청을 받아 처리합니다. 주문을 받아 요리하듯, 저장하고 꺼내고 확인합니다."],
      ["🗄️ 데이터베이스 · 창고","내용을 오래 보관합니다. 재료 창고처럼, 모두의 글이 한곳에 정리되어 쌓입니다."] ],
    tip:"<b>흐름으로 보면</b> 화면에서 '등록'을 누르면 → 백엔드가 요청을 받고 → 데이터베이스에 한 줄 저장한 뒤 → 다시 화면에 모두의 글을 돌려줍니다." },
  { section:"정리", title:"다음 단계로 가려면", list:[
      "<strong>모으기</strong> · 학생 여러 명의 입력을 한 화면에 모으는 앱 (공유 저장소 연결)",
      "<strong>올리기</strong> · 파일 대신 주소 하나로 여는 웹 앱으로 배포하기",
      "<strong>나누기</strong> · 학년 협의회에서 앱 파일과 요청문을 함께 나누고 서로 고쳐 주기",
      "<strong>확인하기</strong> · 학생이 쓰는 앱은 학교 개인정보 지침과 정보 담당 선생님 안내를 먼저 확인합니다." ] },

  /* ---------- 성찰 ---------- */
  { section:"성찰", kind:"section", icon:"🪞", title:"마치며,", em:"내 질문으로 돌아갑니다", lead:"처음에 쓴 질문을 다시 보고, 오늘 만든 앱과 찾은 답, 남은 질문을 정리합니다.", timer:10 },
  { section:"성찰", title:"성찰 쓰기", reflect:true },
  { section:"성찰", title:"수고하셨습니다", lead:"오늘 만든 앱이 첫걸음입니다. 남은 질문은 다음에 만들 앱의 출발점이 됩니다." }
];

<script>
(function(){
  const $ = id => document.getElementById(id);
  const N = SLIDES.length;
  const sections = [...new Set(SLIDES.map(s=>s.section))];
  const firstOf = name => SLIDES.findIndex(s=>s.section===name);
  const dlIndex = SLIDES.findIndex(s=>s.download);
  const fullTitle = s => s.em ? `${s.title} ${s.em}` : s.title;
  const plain = s => String(s).replace(/<[^>]+>/g,"");
  const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  let cur = 0;
  let seen = new Set();
  try{ seen = new Set(JSON.parse(localStorage.getItem(COURSE.storageKey+":seen")||"[]")); }catch(e){}
  const saveSeen = () => { try{ localStorage.setItem(COURSE.storageKey+":seen", JSON.stringify([...seen])); }catch(e){} };

  $("mark").textContent = COURSE.initials;
  $("courseTitle").textContent = COURSE.title;
  $("courseSub").textContent = COURSE.sub;
  $("foot").textContent = COURSE.footer || "";
  if(dlIndex<0) $("dlChip").hidden = true;
  $("dlChip").onclick = ()=>go(dlIndex);

  let toastT;
  function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),1800); }

  /* ---- Lucian #039 sliding pill tabs (header sections) ---- */
  const secTabs = (function(root){
    const bar = root.querySelector('.u039-tabs');
    const pill = root.querySelector('.u039-pill');
    sections.forEach(name=>{
      const b = document.createElement('button');
      b.className='u039-tab'; b.type='button'; b.setAttribute('role','tab'); b.setAttribute('aria-selected','false'); b.textContent=name;
      bar.appendChild(b);
    });
    const tabs = Array.prototype.slice.call(root.querySelectorAll('.u039-tab'));
    let sel = 0;
    function movePill(animate){
      const t = tabs[sel]; if(!t) return;
      if(!animate) pill.style.transition='none';
      pill.style.setProperty('--x', t.offsetLeft+'px');
      pill.style.setProperty('--w', t.offsetWidth+'px');
      if(!animate){ void pill.offsetWidth; pill.style.transition=''; }
    }
    function mark(i, animate){
      sel = i;
      tabs.forEach((t,k)=>{ t.setAttribute('aria-selected', String(k===i)); t.tabIndex = k===i?0:-1; });
      movePill(animate);
      const t = tabs[i], sc = root.parentElement;
      if(sc && (t.offsetLeft < sc.scrollLeft || t.offsetLeft + t.offsetWidth > sc.scrollLeft + sc.clientWidth)) sc.scrollTo({left:t.offsetLeft-20, behavior:'smooth'});
    }
    tabs.forEach((t,i)=>{
      t.addEventListener('click', ()=>go(firstOf(sections[i])));
      t.addEventListener('keydown', e=>{
        const d = e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;
        if(d){ e.preventDefault(); e.stopPropagation(); const n=(i+d+tabs.length)%tabs.length; go(firstOf(sections[n])); tabs[n].focus(); }
      });
    });
    window.addEventListener('resize', ()=>movePill(false));
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>movePill(false));
    return { mark };
  })($("secTabs"));

  /* ---- Lucian #008 copy button, one per prompt ---- */
  const COPY_SVG = '<svg class="u008-cp" viewBox="0 0 24 24" aria-hidden="true"><rect x="8.5" y="8.5" width="11" height="11" rx="2.5"/><path d="M15.5 8.5V6.5a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"/></svg><svg class="u008-ok" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 12.5l4.2 4.2L18.5 8"/></svg>';
  function copyMarkup(text){
    return `<!-- Lucian UX/UI Prompt #008 · MIT License (c) 2026 Seokwoooo · https://lucianlabs.dev/uxui-prompt/#008 -->
      <div class="ux u008 prompt"><div class="u008-box"><div class="u008-code"><b class="u008-cmd">${esc(text)}</b></div>
      <button class="u008-btn" type="button" aria-label="프롬프트 복사">${COPY_SVG}</button><span class="u008-tip" role="status"></span></div></div>`;
  }
  function initCopy(root){
    var btn = root.querySelector('.u008-btn'), cmd = root.querySelector('.u008-cmd'), tip = root.querySelector('.u008-tip'), box = root.querySelector('.u008-box');
    var t = 0;
    function write(s){
      try{ if(navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(s).then(()=>true, ()=>false); }catch(e){}
      return Promise.resolve(false);
    }
    function run(){
      write(cmd.textContent).then(ok=>{
        if(ok) return;
        var r=document.createRange(); r.selectNodeContents(cmd); var s=getSelection(); s.removeAllRanges(); s.addRange(r);
        toast("선택했습니다. Ctrl+C(⌘+C)로 복사하세요");
      });
      clearTimeout(t);
      root.classList.remove('is-copied'); void root.offsetWidth; root.classList.add('is-copied');
      tip.textContent = '복사됨';
      t = setTimeout(function(){ if(root.isConnected){ root.classList.remove('is-copied'); tip.textContent=''; } }, 1800);
    }
    btn.addEventListener('click', function(e){ e.stopPropagation(); run(); });
    box.addEventListener('click', function(){ if(!getSelection().toString()) run(); });
  }

  /* ---- Lucian #100 flip timer (single instance) ---- */
  const timerEl = $("timerTpl").content.querySelector('.u100').cloneNode(true);
  const timerApi = (function(root){
    var clk = root.querySelector('.u100-clk'), st = root.querySelector('.u100-st'), pr = root.querySelector('.u100-pr i'), ps = root.querySelector('.u100-ps'), go = root.querySelector('.u100-go'), rs = root.querySelector('.u100-rs');
    var rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var PLAY = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.4v11.2L13.2 8z"/></svg>', PAUSE = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3.4" y="2.6" width="3.2" height="10.8" rx="1"/><rect x="9.4" y="2.6" width="3.2" height="10.8" rx="1"/></svg>';
    var cards = [];
    [0, 1, 'c', 2, 3].forEach(function (k) {
      if (k === 'c') { var c = document.createElement('span'); c.className = 'u100-co'; c.setAttribute('aria-hidden', 'true'); c.innerHTML = '<i></i><i></i>'; clk.appendChild(c); return; }
      var f = document.createElement('span');
      f.className = 'u100-fl'; f.setAttribute('aria-hidden', 'true');
      f.innerHTML = '<span class="u100-t"><b>0</b></span><span class="u100-b"><b>0</b></span><span class="u100-ft"><b>0</b></span><span class="u100-fb"><b>0</b></span>';
      clk.appendChild(f);
      cards.push({ el: f, v: '0', t: f.querySelector('.u100-t b'), b: f.querySelector('.u100-b b'), ft: f.querySelector('.u100-ft'), fb: f.querySelector('.u100-fb') });
    });
    function flip(c, v) {
      if (c.v === v) return;
      var old = c.v; c.v = v;
      c.t.textContent = v;
      c.ft.firstChild.textContent = old; c.fb.firstChild.textContent = v;
      if (rm || !root.isConnected || !c.ft.animate) { c.b.textContent = v; return; }
      c.b.textContent = old;
      c.ft.getAnimations().forEach(function (a) { a.cancel(); }); c.fb.getAnimations().forEach(function (a) { a.cancel(); });
      c.ft.animate([{ transform: 'perspective(320px) rotateX(0deg)', filter: 'brightness(1)' }, { transform: 'perspective(320px) rotateX(-90deg)', filter: 'brightness(.6)' }], { duration: 240, easing: 'cubic-bezier(.55,0,.9,.6)' });
      var a = c.fb.animate([{ transform: 'perspective(320px) rotateX(90deg)', filter: 'brightness(1.5)' }, { transform: 'perspective(320px) rotateX(0deg)', filter: 'brightness(1)' }], { duration: 300, delay: 240, easing: 'cubic-bezier(.2,.9,.3,1.25)', fill: 'forwards' });
      a.onfinish = function () { c.b.textContent = c.v; a.cancel(); };
    }
    // adapted: practice-length presets instead of 15초/1분/5분/25분
    var PRE = [[600, '10분'], [900, '15분'], [1200, '20분'], [1800, '30분']];
    var total = 1200, left = 1200000, end = 0, run = false, timer = 0, last = '', sessions = 0;
    var pb = PRE.map(function (p) {
      var b = document.createElement('button');
      b.type = 'button'; b.textContent = p[1]; b.setAttribute('aria-pressed', String(p[0] === total));
      b.addEventListener('click', function () { setTotal(p[0]); pb.forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); }); });
      ps.appendChild(b);
      return b;
    });
    var more = document.createElement('button');
    more.type = 'button'; more.className = 'more'; more.textContent = '1분 더';
    ps.appendChild(more);
    // adapted: report state so the header can show the time while you're on other slides
    function emit(ms) { root.dispatchEvent(new CustomEvent('u100state', { detail: { ms: ms, run: run, done: root.classList.contains('done'), paused: !run && left < total * 1000 && !root.classList.contains('done') } })); }
    function show(ms, quiet) {
      var s = Math.ceil(ms / 1000), str = ('0' + Math.floor(s / 60)).slice(-2) + ('0' + s % 60).slice(-2);
      if (str.length > 4) str = '9959';
      str.split('').forEach(function (ch, i) { if (quiet) { cards[i].v = ch; cards[i].t.textContent = ch; cards[i].b.textContent = ch; } else flip(cards[i], ch); });
      pr.style.setProperty('--p', Math.max(0, Math.min(1, ms / (total * 1000))).toFixed(4));
      root.classList.toggle('warn', run && s <= 10 && s > 0);
      if (str !== last) { clk.setAttribute('aria-label', '남은 시간 ' + Math.floor(s / 60) + '분 ' + s % 60 + '초'); last = str; }
      if (run && s <= 10 && s > 0) st.textContent = '마지막 ' + s + '초';
      emit(ms);
    }
    function label() { go.innerHTML = (run ? PAUSE + '멈추기' : PLAY + (root.classList.contains('done') ? '다시 시작' : left < total * 1000 ? '이어서' : '시작')); }
    function loop() {
      timer = 0;
      if (!run) return;
      left = Math.max(0, end - performance.now());
      show(left);
      if (left <= 0) return finish();
      timer = setTimeout(loop, 200);
    }
    function finish() {
      run = false; root.classList.remove('run', 'warn'); root.classList.add('done');
      st.textContent = '끝났어요 · 함께 나눠요';
      var dots = root.querySelectorAll('.u100-ss i'), n = root.querySelectorAll('.u100-ss i.on').length;
      if (n >= dots.length) { dots.forEach(function (d) { d.classList.remove('on'); }); n = 0; }
      dots[n].classList.add('on', 'pop'); setTimeout(function () { dots[n].classList.remove('pop'); }, 700);
      sessions++; root.querySelector('.u100-sn').textContent = '오늘 실습 ' + sessions + '번 마쳤어요';
      if (!rm) { clk.classList.remove('shake'); void clk.offsetWidth; clk.classList.add('shake'); }
      label(); emit(0);
    }
    function setTotal(sec) {
      clearTimeout(timer); run = false; root.classList.remove('run', 'warn', 'done');
      total = sec; left = sec * 1000;
      st.textContent = '준비됐어요';
      show(left); label();
    }
    go.addEventListener('click', function () {
      if (run) {
        run = false; clearTimeout(timer); left = Math.max(0, end - performance.now());
        root.classList.remove('run'); st.textContent = '잠깐 멈췄어요'; label(); emit(left);
        return;
      }
      if (root.classList.contains('done')) { root.classList.remove('done'); left = total * 1000; show(left); }
      run = true; end = performance.now() + left;
      root.classList.add('run'); st.textContent = '실습하는 중';
      label(); loop();
    });
    more.addEventListener('click', function () {
      if (root.classList.contains('done')) root.classList.remove('done');
      total += 60;
      if (run) end += 60000; else left += 60000;
      if (!run) st.textContent = '1분 늘렸어요';
      show(run ? end - performance.now() : left); label();
      if (more.animate) more.animate([{ transform: 'scale(.92)' }, { transform: 'none' }], { duration: 260, easing: 'cubic-bezier(.3,1.4,.5,1)' });
    });
    rs.addEventListener('click', function () {
      var i = pb.findIndex(function (b) { return b.getAttribute('aria-pressed') === 'true'; });
      setTotal(i >= 0 ? PRE[i][0] : 1200);
    });
    show(left, true); label();
    // adapted: pick the slide's suggested length when the timer is idle
    return {

  let timerSlide = -1;

  const fmt = ms => { const s=Math.max(0,Math.ceil(ms/1000)); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); };
  timerEl.addEventListener('u100state', e=>{
    const d = e.detail;
    const visible = d.run || d.paused || d.done;

  /* ---- shared questions & reflections (db capability) ---- */

  function modeNotice(){

  // Lucian #028 autogrow composer
  function composerMarkup(o){
    return `<!-- Lucian UX/UI Prompt #028 · MIT License (c) 2026 Seokwoooo · https://lucianlabs.dev/uxui-prompt/#028 -->
      <div class="ux u028 field${o.send?"":" nosend"}" data-key="${o.key}" data-max="${o.max}">
        <div class="u028-box">
          <textarea class="u028-ta" id="f-${o.key}" rows="1" placeholder="${esc(o.ph)}" aria-label="${esc(o.label)}">${esc(o.value||"")}</textarea>
          <div class="u028-foot"><span class="u028-hint">${esc(o.hint||"")}</span>
            <span class="u028-ring" aria-hidden="true"><svg viewBox="0 0 30 30"><circle class="bg" cx="15" cy="15" r="12"/><circle class="fg" cx="15" cy="15" r="12"/></svg><span class="u028-left"></span></span>
            <span class="u028-sep" aria-hidden="true"></span><button class="u028-send" type="button">${esc(o.send||"")}</button></div>
        </div><span class="u028-sr" aria-live="polite"></span></div>`;
  }
  function initComposer(root, onSend){
    var ta = root.querySelector('.u028-ta'), left = root.querySelector('.u028-left'), send = root.querySelector('.u028-send'), sr = root.querySelector('.u028-sr');
    var MAX = +root.dataset.max || 140, LH = 26, MAXH = 182;
    function grow(){
      var h = ta.style.height;
      ta.style.transition='none'; ta.style.height=LH+'px';
      var need = Math.min(MAXH, ta.scrollHeight);
      ta.style.height = h || LH+'px'; void ta.offsetHeight; ta.style.transition=''; ta.style.height = need+'px';
      ta.style.overflowY = ta.scrollHeight > MAXH ? 'auto' : 'hidden';
    }
    function count(){
      var n = Array.from(ta.value).length, rest = MAX - n;
      root.style.setProperty('--p', Math.min(1, n/MAX).toFixed(3));
      root.classList.toggle('is-near', rest <= 20);
      root.classList.toggle('is-over', rest < 0);
      left.textContent = rest;
      send.setAttribute('aria-disabled', String(n===0 || rest<0 || root.dataset.locked==="1"));
      if(rest===20||rest===0||rest===-1) sr.textContent = rest>=0 ? rest+'자 남았어요' : '글자 수를 넘었어요';
    }
    ta.addEventListener('input', function(){ grow(); count(); });
    if(onSend){
      send.addEventListener('click', function(){
        if(send.getAttribute('aria-disabled')==='true'){ ta.focus(); return; }
        onSend(ta.value.trim()).then(function(ok){
          if(!ok || !root.isConnected) return;
          ta.value=''; grow(); count();
          sr.textContent='등록했어요'; send.textContent='등록됨';
          setTimeout(function(){ if(root.isConnected) send.textContent='등록'; }, 1400);
        });
      });
      ta.addEventListener('keydown', function(e){ if(e.key==='Enter' && (e.metaKey||e.ctrlKey)){ e.preventDefault(); send.click(); } });
    }
    root.refresh = count;
    requestAnimationFrame(function(){ grow(); count(); });
    return { value: function(){ return ta.value.trim(); }, over: function(){ return Array.from(ta.value).length > MAX; } };
  }

  async function paintQWall(){

  async function writeQuestions(items){

  function reflectMarkup(){

      <div><span class="flabel" id="starsL">5. 궁금증이 얼마나 풀렸나요? <small>1~5점</small></span>

  function wireReflect(card){
    const fields = {};
    card.querySelectorAll('.u028').forEach(c=>{ fields[c.dataset.key] = initComposer(c, null); });

    const lvlEl = card.querySelector('#lvl');
    if(lvlEl) lvlEl.addEventListener('click', e=>{
      const b = e.target.closest('button[data-lv]'); if(!b) return;

    });
    // per-question ratings, aligned with the questions shown when this slide was drawn
    const rItems = myItems().slice();
    const qsel = {};
    const prevQa = {}; qaOf(myRef()).forEach(x=>{ prevQa[x.t] = x.lv; });
    rItems.forEach((q,i)=>{ if(QLV[prevQa[q.t]]) qsel[i] = prevQa[q.t]; });
    const qaNow = () => rItems.map((q,i)=>({ t:q.t, lv:qsel[i]||"" }));
    function meter(){
      const el = card.querySelector('#qMeter'); if(!el) return;
      const p = pctOf(qaNow());
      el.style.setProperty('--p', (p==null?0:p)+'%');

      meter();
    }));

        <p><b>오늘 찾은 답</b>${esc(d.learned||"")}</p><p><b>수업에 적용할 한 가지</b>${esc(d.apply||"")}</p>${d.next?`<p><b>이어서 탐구할 질문</b>${esc(d.next)}</p>`:""}`;
      if(p.color) el.style.setProperty('--c', p.color);
      el.querySelector('header span').textContent = mine ? "나" : (p.name || "선생님");

  function repaint(){
    const s = SLIDES[cur];
    if(s.ask) paintAsk();
    if(s.reflect){
      const c = $("card");

      if(c.dataset.qn !== String(myItems().length) && c.dataset.dirty !== "1") renderSlide(); else paintReflect();
    }
    renderToc();
    if($("admin").classList.contains("open")) paintAdmin();
  }

  (async function connect(){
    const fallback = (mode, err)=>{ S.mode = mode; S.err = err||""; repaint(); };
    if(!window.claude || typeof window.claude.use !== "function"){ fallback("local"); return; }
    let timer = setTimeout(()=>{ if(S.mode==="loading") fallback("local"); }, 10000);
    try{
      userApi = await window.claude.use("user");
      db = await window.claude.use("db");
      if(!db || !userApi){ clearTimeout(timer); fallback("local"); return; }
      S.me = await userApi.id();
      if(!S.me){ clearTimeout(timer); fallback("local"); return; }
    }catch(e){ clearTimeout(timer); fallback("local"); return; }
    try{ if(typeof userApi.isOwner === "function" && await userApi.isOwner()) $("adminChip").hidden = false; }catch(e){}
    try{ dlApi = await window.claude.use("downloads"); }catch(e){ dlApi = null; }
    if(dlApi) $("aFile").hidden = false;
    const ready = ()=>{ if(S.qReady && S.rReady){ clearTimeout(timer); S.mode = "shared"; repaint(); } };
    const onErr = e=>{ clearTimeout(timer); fallback("error", "모두의 기록을 불러오지 못했습니다. 페이지를 다시 열어 주세요."); };
    db.collection("questions").orderBy("updatedAt","desc").onSnapshot(snap=>{
      S.qDocs = snap.docs.map(d=>Object.assign({ id:d.id }, d.data()));
      S.qReady = true; if(S.mode==="shared") repaint(); else ready();
    }, onErr);
    db.collection("reflections").orderBy("updatedAt","desc").onSnapshot(snap=>{
      S.rDocs = snap.docs.map(d=>Object.assign({ id:d.id }, d.data()));
      S.rReady = true; if(S.mode==="shared") repaint(); else ready();
    }, onErr);
  })();

  /* ---- admin (owner only): search & export ---- */
  const adminEl = $("admin");
  let aKind = "all", aNames = {};
  function allData(){
    const qDocs = shared() ? S.qDocs.filter(d=>Array.isArray(d.items) && d.items.length) : (local.items.length ? [{id:"local", items:local.items}] : []);
    const rDocs = shared() ? S.rDocs.filter(d=>d.learned) : (local.ref ? [Object.assign({id:"local"}, local.ref)] : []);
    return { qDocs, rDocs };
  }
  const who = id => id==="local" ? "나" : ((aNames[id] && aNames[id].name) || "선생님");
  function slideText(s){
    return [s.title, s.em, s.lead, s.p].concat(s.list||[], (s.steps||[]).map(x=>x.join(" · ")), [].concat(s.copy||[]), [s.tip])
      .filter(Boolean).map(plain).join("\n");
  }
  function refLines(d){
    const lines = qaOf(d).map(x=>`${x.t} → ${QLV[x.lv] ? QLV[x.lv][0] : "미응답"}`);
    if(!qaOf(d).length && LV[d.level]) lines.push("처음 질문: " + LV[d.level]);
    if(d.learned) lines.push("오늘 찾은 답: " + d.learned);
    if(d.apply) lines.push("수업에 적용할 한 가지: " + d.apply);
    if(d.next) lines.push("이어서 탐구할 질문: " + d.next);
    if(+d.stars>=1) lines.push("궁금증 별점: " + d.stars + "점");
    return lines;
  }
  function hl(text, q){
    if(!q) return esc(text.length>200 ? text.slice(0,200)+"…" : text);
    const i = text.toLowerCase().indexOf(q);
    if(i<0) return esc(text.length>200 ? text.slice(0,200)+"…" : text);
    const st = Math.max(0, i-60), en = Math.min(text.length, i+q.length+140);
    const seg = text.slice(st,en), low = seg.toLowerCase();
    let out = "", p = 0, j;
    while((j = low.indexOf(q,p)) >= 0){ out += esc(seg.slice(p,j)) + "<mark>" + esc(seg.slice(j,j+q.length)) + "</mark>"; p = j+q.length; }
    return (st>0?"…":"") + out + esc(seg.slice(p)) + (en<text.length?"…":"");
  }
  function avgPct(rDocs){ const ps = rDocs.map(d=>pctOf(qaOf(d))).filter(p=>p!=null); return ps.length ? Math.round(ps.reduce((a,b)=>a+b,0)/ps.length) : null; }
  async function paintAdmin(){
    const { qDocs, rDocs } = allData();
    const ids = [...new Set(qDocs.map(d=>d.id).concat(rDocs.map(d=>d.id)))];
    aNames = shared() ? await names(ids.filter(x=>x!=="local")) : {};
    const nq = qDocs.reduce((n,d)=>n+d.items.length, 0), pa = avgPct(rDocs);
    $("aStats").innerHTML = [["참여 선생님", ids.length+"명"], ["질문", nq+"개"], ["성찰 제출", rDocs.length+"명"], ["궁금증 해소도 평균", pa==null ? "–" : pa+"%"]]
      .map(([a,b])=>`<div><small>${a}</small><b>${b}</b></div>`).join("");
    runSearch();
  }
  function runSearch(){
    const q = $("aQ").value.trim().toLowerCase();
    const { qDocs, rDocs } = allData();
    const rows = [];
    if(aKind==="all" || aKind==="slide") SLIDES.forEach((s,i)=>rows.push({ k:"slide", i, label:`연수 자료 · ${i+1}. ${fullTitle(s)}`, text:slideText(s) }));
    if(aKind==="all" || aKind==="q") qDocs.forEach(d=>d.items.forEach(it=>rows.push({ k:"q", label:`질문 · ${who(d.id)}`, text:it.t })));
    if(aKind==="all" || aKind==="r") rDocs.forEach(d=>{ const p = pctOf(qaOf(d)); rows.push({ k:"r", label:`성찰 · ${who(d.id)}${p!=null?` · 해소도 ${p}%`:""}`, text:refLines(d).join("\n") }); });
    const hits = q ? rows.filter(r=>(r.label+"\n"+r.text).toLowerCase().includes(q)) : rows;
    $("aInfo").textContent = q ? `"${$("aQ").value.trim()}" 검색 결과 ${hits.length}건` : `모두 ${hits.length}건 · 검색어를 넣으면 좁혀집니다`;
    const box = $("aRes"); box.innerHTML = "";
    if(!hits.length){ box.innerHTML = `<p class="notice">찾는 내용이 없습니다.</p>`; return; }
    hits.slice(0,300).forEach(r=>{
      const el = document.createElement(r.k==="slide" ? "button" : "div");
      el.className = "ahit";
      if(r.k==="slide"){ el.type = "button"; el.addEventListener("click", ()=>{ closeAdmin(); go(r.i); }); }
      el.innerHTML = `<small>${esc(r.label)}${r.k==="slide"?" · 눌러서 이동":""}</small><span>${hl(r.text, q)}</span>`;
      box.appendChild(el);
    });
  }
  function openAdmin(){ adminEl.classList.add("open"); paintAdmin(); setTimeout(()=>$("aQ").focus(), 60); }
  function closeAdmin(){ adminEl.classList.remove("open"); $("adminChip").focus(); }
  $("adminChip").onclick = openAdmin;
  $("adminClose").onclick = closeAdmin;
  adminEl.addEventListener("click", e=>{ if(e.target===adminEl) closeAdmin(); });
  adminEl.addEventListener("keydown", e=>{ if(e.key==="Escape"){ e.stopPropagation(); closeAdmin(); } });
  $("aQ").addEventListener("input", runSearch);
  $("aKind").addEventListener("click", e=>{
    const b = e.target.closest("button[data-k]"); if(!b) return;
    aKind = b.dataset.k;
    $("aKind").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed", String(x===b)));
    runSearch();
  });

  const REPORT_CSS = `.rp{font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;color:#1d2433;font-size:11pt;line-height:1.6;max-width:820px;margin:0 auto;word-break:keep-all}
.rp h1{font-size:19pt;margin:0 0 2pt}.rp .meta{color:#667085;font-size:9.5pt;margin:0 0 14pt}
.rp h2{font-size:14pt;margin:20pt 0 8pt;padding-bottom:4pt;border-bottom:2px solid #3b63f6}
.rp h3{font-size:11.5pt;margin:0 0 4pt}
.rp table{width:100%;border-collapse:collapse;font-size:10pt}
.rp th,.rp td{border:1px solid #d0d5dd;padding:5pt 7pt;text-align:left;vertical-align:top}
.rp th{background:#f2f4f7}.rp tr{break-inside:avoid}
.rp .stat{display:flex;gap:8pt;flex-wrap:wrap;margin:0 0 6pt}.rp .stat span{border:1px solid #d0d5dd;border-radius:6pt;padding:4pt 10pt}
.rp .box{break-inside:avoid;border:1px solid #e4e7ec;border-radius:8pt;padding:8pt 12pt;margin:0 0 8pt}
.rp .box p{margin:2pt 0}.rp .box b{color:#475467}
.rp ul{margin:3pt 0;padding-left:16pt}
.rp .copy{white-space:pre-wrap;background:#f4f7ff;border-radius:6pt;padding:6pt 9pt;font-size:9.5pt;margin:4pt 0}
.rp .noprint{margin:0 0 14pt}.rp .noprint button{font:inherit;font-size:11pt;padding:8pt 16pt;border-radius:20pt;border:0;background:#3b63f6;color:#fff;cursor:pointer}
@media print{.rp .noprint{display:none}}`;
  function reportInner(withSlides){
    const { qDocs, rDocs } = allData();
    const pa = avgPct(rDocs);
    let h = `<div class="rp"><h1>${esc(COURSE.title)}</h1><p class="meta">질문·성찰 기록 · ${esc(new Date().toLocaleString("ko-KR"))} 기준</p>`;
    h += `<div class="stat"><span>참여 선생님 ${new Set(qDocs.map(d=>d.id).concat(rDocs.map(d=>d.id))).size}명</span><span>질문 ${qDocs.reduce((n,d)=>n+d.items.length,0)}개</span><span>성찰 제출 ${rDocs.length}명</span><span>궁금증 해소도 평균 ${pa==null?"–":pa+"%"}</span></div>`;
    h += `<h2>1. 처음 질문과 궁금증 해소 정도</h2>`;
    if(!qDocs.length) h += `<p>등록된 질문이 없습니다.</p>`;
    else {
      h += `<table><thead><tr><th style="width:16%">선생님</th><th>질문</th><th style="width:20%">해소 정도</th></tr></thead><tbody>`;
      qDocs.forEach(d=>{
        const rd = rDocs.find(x=>x.id===d.id), m = {}; qaOf(rd).forEach(x=>{ m[x.t] = x.lv; });
        d.items.forEach((it,k)=>{ h += `<tr><td>${k===0?esc(who(d.id)):""}</td><td>${esc(it.t)}</td><td>${QLV[m[it.t]] ? QLV[m[it.t]][0] : (rd ? "평가 안 함" : "성찰 미제출")}</td></tr>`; });
      });
      h += `</tbody></table>`;
    }
    h += `<h2>2. 성찰 모음</h2>`;
    if(!rDocs.length) h += `<p>제출된 성찰이 없습니다.</p>`;
    rDocs.forEach(d=>{
      const p = pctOf(qaOf(d));
      h += `<div class="box"><h3>${esc(who(d.id))}${p!=null?` · 궁금증 해소도 ${p}%`:(LV[d.level]?` · ${LV[d.level]}`:"")}${+d.stars>=1?` · ★ ${+d.stars}점`:""}</h3>`
        + `<p><b>오늘 찾은 답</b> ${esc(d.learned||"")}</p><p><b>수업에 적용할 한 가지</b> ${esc(d.apply||"")}</p>${d.next?`<p><b>이어서 탐구할 질문</b> ${esc(d.next)}</p>`:""}</div>`;
    });
    if(withSlides){
      h += `<h2>3. 연수 자료</h2>`;
      SLIDES.forEach((s,i)=>{
        h += `<div class="box"><h3>${i+1}. ${esc(fullTitle(s))}</h3>`;
        if(s.lead) h += `<p>${esc(s.lead)}</p>`;
        if(s.p) h += `<p>${esc(plain(s.p))}</p>`;
        if(s.list) h += `<ul>${s.list.map(x=>`<li>${esc(plain(x))}</li>`).join("")}</ul>`;
        if(s.steps) h += `<ul>${s.steps.map(([t,d])=>`<li><b>${esc(t)}</b> · ${esc(d)}</li>`).join("")}</ul>`;
        if(s.copy) h += [].concat(s.copy).map(c=>`<div class="copy">${esc(c)}</div>`).join("");
        if(s.tip) h += `<p>💡 ${esc(plain(s.tip))}</p>`;
        h += `</div>`;
      });
    }
    return h + `</div>`;
  }
  $("aPrint").onclick = ()=>{
    $("printArea").innerHTML = `<style>${REPORT_CSS}</style>` + reportInner($("aSlides").checked);
    try{ window.print(); }catch(e){ $("aMsg").textContent = "인쇄 창을 열 수 없습니다. '보고서 파일 받기'를 써 주세요."; }
  };
  $("aFile").onclick = async ()=>{
    if(!dlApi) return;
    const d = new Date(), ymd = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    const html = `<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(COURSE.title)} 기록 ${ymd}</title><style>body{margin:24px}${REPORT_CSS}</style></head><body><div class="rp"><div class="noprint"><button type="button" onclick="print()">🖨 인쇄 / PDF로 저장</button></div></div>${reportInner($("aSlides").checked)}<scr`+`ipt>window.addEventListener("load",function(){setTimeout(function(){print()},400)});</scr`+`ipt></body></html>`;
    $("aMsg").textContent = "";
    try{
      await dlApi.save({ filename:`${COURSE.title} 기록 ${ymd}.html`, data:html });
      $("aMsg").textContent = "✓ 받았습니다. 파일을 열면 인쇄 창이 뜹니다.";
    }catch(e){
      $("aMsg").textContent = e && e.code==="declined" ? "받기를 취소했습니다." : e && e.code==="rate_limited" ? "잠시 뒤 다시 눌러 주세요." : "파일을 만들지 못했습니다.";
    }
  };

  /* ---- toc ---- */
  function renderToc(){
    let html = "", last = null;
    SLIDES.forEach((s,i)=>{
      if(s.section!==last){ html += `<div class="toc-sec">${esc(s.section)}</div>`; last = s.section; }
      const isSeen = seen.has(i) && i!==cur;
      let tag = s.download ? '<span class="tag">⬇ 받기</span>' : "";
      if(s.ask) tag = myItems().length ? '<span class="tag">✓ 제출</span>' : '<span class="tag write">✍️ 쓰기</span>';
      if(s.reflect) tag = myRef() ? '<span class="tag">✓ 제출</span>' : '<span class="tag write">✍️ 쓰기</span>';
      html += `<button type="button" class="toc-item${isSeen?" seen":""}${s.download?" dlrow":""}" data-i="${i}" ${i===cur?'aria-current="true"':""}>
        <span class="n">${isSeen?"✓":i+1}</span><span>${esc(fullTitle(s))}</span>${tag}</button>`;
    });
    $("tocList").innerHTML = html;
    $("seenCount").innerHTML = `<strong>${seen.size}</strong> / ${N} 장을 봤습니다`;
    const a = $("tocList").querySelector('[aria-current="true"]');
    if(a) a.scrollIntoView({block:"nearest"});
  }
  $("tocList").addEventListener("click", e=>{
    const b = e.target.closest(".toc-item"); if(!b) return;
    go(+b.dataset.i); closeToc();
  });

  /* ---- slide ---- */
  function renderSlide(){
    const s = SLIDES[cur], card = $("card");
    const isSec = s.kind==="section";
    card.className = "card" + (isSec ? " section" : " top-align");
    let head = "";
    if(isSec) head += `<span class="pill">${esc(s.icon||"✨")} ${esc(s.section)}${s.num!=null?` · ${String(s.num).padStart(2,"0")}`:""}</span>`;
    else head += `<div class="eyebrow">${esc(s.section)} · ${cur+1} / ${N}</div>`;
    head += `<h1 class="t">${esc(s.title)}${s.em?`<span class="g">${esc(s.em)}</span>`:""}</h1>`;
    if(s.lead) head += `<p class="lead">${esc(s.lead)}</p>`;
    let b = "";
    if(s.img) b += `<figure class="fig"><img src="${esc(s.img)}" alt="${esc(s.alt||"")}" width="1920" height="1080" decoding="async"></figure>`;
    if(s.p) b += `<p>${s.p}</p>`;
    if(s.list) b += `<ul>${s.list.map(x=>`<li><span>${x}</span></li>`).join("")}</ul>`;
    if(s.steps) b += `<ol class="steps">${s.steps.map(([t,d])=>`<li><b>${esc(t)}</b><small>${esc(d)}</small></li>`).join("")}</ol>`;
    if(s.copy) b += `<div class="copy-list">${[].concat(s.copy).map(copyMarkup).join("")}</div>`;
    if(s.tip) b += `<div class="tip">${s.tip}</div>`;
    if(s.download){
      b += COURSE.downloadUrl
        ? `<a class="linkbtn" href="${esc(COURSE.downloadUrl)}" target="_blank" rel="noopener">⬇ 완성 파일 열기</a>`
        : `<span class="linkbtn disabled">⬇ 완성 파일 링크 준비 중</span>`;
    }
    if(s.ask) b += askMarkup();
    if(s.reflect) b += reflectMarkup();
    let inner = head + (b ? `<div class="body">${b}</div>` : "");
    if(s.timer) inner = `<div class="sec-grid"><div>${inner}</div><div class="timer-slot"></div></div>`;
    card.innerHTML = `<div class="in">${inner}</div>`;
    card.querySelectorAll('.u008').forEach(initCopy);
    if(s.ask) wireAsk(card);
    if(s.reflect) wireReflect(card);
    if(s.timer){
      card.querySelector('.timer-slot').appendChild(timerEl);
      timerSlide = cur;
      timerApi.prefer(s.timer);
    }
  }

  function go(i){
    if(i<0||i>=N) return;
    cur = i; seen.add(i); saveSeen();
    renderSlide(); renderToc();
    $("bar").style.width = ((i+1)/N*100)+"%";
    $("prev").disabled = i===0; $("next").disabled = i===N-1;
    secTabs.mark(sections.indexOf(SLIDES[i].section), true);
    const hash = "#s"+(i+1);
    if(location.hash!==hash) history.replaceState(null,"",hash);
    try{ localStorage.setItem(COURSE.storageKey+":cur", i); }catch(e){}
    window.scrollTo({top:0});
  }
  $("prev").onclick = ()=>go(cur-1);
  $("next").onclick = ()=>go(cur+1);
  document.addEventListener("keydown", e=>{
    if($("admin").classList.contains("open")) return;
    if(e.target.closest("input,textarea,[contenteditable],[role=tab]")) return;
    if(e.key==="ArrowRight"){ e.preventDefault(); go(cur+1); }
    if(e.key==="ArrowLeft"){ e.preventDefault(); go(cur-1); }
    if(e.key==="Escape") closeToc();
  });

  function openToc(){ $("toc").classList.add("open"); $("scrim").classList.add("open"); }
  function closeToc(){ $("toc").classList.remove("open"); $("scrim").classList.remove("open"); }
  $("tocBtn").onclick = openToc; $("tocClose").onclick = closeToc; $("scrim").onclick = closeToc;
  $("resetSeen").onclick = ()=>{ seen = new Set([cur]); saveSeen(); renderToc(); toast("본 기록을 지웠습니다"); };

  function fromHash(){ const m = /^#s(\d+)$/.exec(location.hash); return m ? Math.min(N, Math.max(1, +m[1]))-1 : null; }
  window.addEventListener("hashchange", ()=>{ const i=fromHash(); if(i!=null && i!==cur) go(i); });
  let start = fromHash();
  if(start==null){ try{ const v = localStorage.getItem(COURSE.storageKey+":cur"); if(v!=null) start = Math.min(N-1, +v||0); }catch(e){} }
  go(start ?? 0);
})();
</script>

<script>/* 관리자 버튼: 주소 끝에 ?admin 을 붙여 열면 보입니다 (claude.ai 밖에서는 소유자를 확인할 수 없어서) */
if(/[?&]admin\b/.test(location.search)) document.getElementById("adminChip").hidden = false;</script>
